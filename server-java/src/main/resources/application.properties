spring.application.name=course-compass
server.port=${PORT:5000}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/coursecompass}

# JWT
jwt.secret=${JWT_SECRET:course-compass-jwt-secret-key-must-be-at-least-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRE_MS:2592000000}

# CORS
app.cors.allowed-origin=${CLIENT_URL:http://localhost:5173}
